<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIM - Research Chat Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="logo">
                <span class="logo-icon">K</span>
                <span class="logo-text">KIM</span>
            </div>
            <p class="subtitle">AI Research Assistant</p>
        </header>

        <main class="chat-main" id="chat-main">
            <div class="welcome-message">
                <div class="ai-avatar">K</div>
                <div class="message-content">
                    <p>Hello! I'm KIM, your AI research assistant.</p>
                    <p>Ask me anything about research papers, vector databases, meta-prompting, or any topic you'd like to explore.</p>
                </div>
            </div>

            <div id="messages-container"></div>
        </main>

        <footer class="chat-input-area">
            <div class="input-wrapper">
                <textarea 
                    id="chat-input" 
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button id="send-btn" class="send-btn">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
            <p class="hint">Press Enter to send, Shift+Enter for new line</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
